<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Hoffein Attorneys</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
<div class="auth-container">
    <div class="auth-box">
        <img src="{{ url_for('static', filename='images/hoffein.png') }}" class="auth-logo" alt="Hoffein Attorneys">
        <h1>Create Account</h1>
        <p class="auth-subtitle">Create your client account</p>
        {% if error %}<div class="error-message">{{ error }}</div>{% endif %}
        <form method="POST" action="/register">
            <div class="input-group"><label>Full Name</label><input type="text" name="name" placeholder="Enter your full name" required></div>
            <div class="input-group"><label>Telephone Number</label><input type="tel" name="phone" placeholder="e.g. +255 700 000 000" autocomplete="tel"></div>
            <div class="input-group"><label>Email Address</label><input type="email" name="email" placeholder="Enter your email" required></div>
            <div class="input-group"><label>Password</label><input type="password" name="password" placeholder="Create a password" required></div>
            <button type="submit" class="auth-button">Create Account</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="/login">Login</a></p>
        <a href="/" class="back-home">← Back to website</a>
    </div>
</div>
</body>
</html>
