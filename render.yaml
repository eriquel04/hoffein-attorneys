services:
  - type: web
    name: hoffein-attorneys
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python init_database.py && gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/status
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: TEST_LAWYER_EMAIL
        sync: false
      - key: TEST_LAWYER_PASSWORD
        sync: false
      - key: TEST_CLIENT_EMAIL
        sync: false
      - key: TEST_CLIENT_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
